<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Fire icon with evacuation path -->
  <defs>
    <linearGradient id="fireGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B35;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#F7931E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFD23F;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="#1F2937" stroke="#374151" stroke-width="2"/>
  
  <!-- Fire flames -->
  <path d="M 35 70 Q 30 50, 40 45 Q 35 40, 45 50 Q 40 35, 50 40 Q 45 30, 55 45 Q 50 50, 60 55 Q 55 60, 50 70 Z" fill="url(#fireGradient)"/>
  <path d="M 45 70 Q 40 55, 50 50 Q 45 45, 55 55 Q 50 60, 45 70 Z" fill="#FF4500" opacity="0.8"/>
  
  <!-- Exit door/arrow -->
  <path d="M 70 30 L 85 50 L 70 70 L 75 50 Z" fill="#10B981" stroke="#059669" stroke-width="2"/>
  <rect x="65" y="45" width="8" height="10" fill="#10B981"/>
  
  <!-- Person/agent running -->
  <circle cx="30" cy="55" r="4" fill="#3B82F6"/>
  <path d="M 30 59 L 30 65 L 25 70" stroke="#3B82F6" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M 30 65 L 35 70" stroke="#3B82F6" stroke-width="2" fill="none" stroke-linecap="round"/>
</svg>
